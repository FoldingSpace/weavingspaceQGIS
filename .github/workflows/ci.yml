# Continuous integration for the WeavingSpace QGIS plugin.
#
# WHY THIS EXISTS, and what it is deliberately NOT for.
#
# This plugin is developed on one macOS machine with one QGIS. The
# module that exists precisely because QGIS moves its APIs
# (weavingspace_qgis/compat.py) has therefore never run against any
# QGIS but that one. CI's job here is the coverage a laptop cannot
# give: a DIFFERENT platform, a DIFFERENT QGIS, and a CLEAN checkout
# with none of the untracked files a working tree accumulates.
#
# Linux is the right target for a first CI, and not only because the
# official QGIS containers make it easy. Linux is where QGIS uses the
# distribution's Python, so it is the platform where deps.py's
# PyPI-provisioning path actually fires -- the very code a plugin
# repository reviewer will look at hardest, and the code this project
# cannot exercise at home.
#
# WINDOWS, added later and deliberately NARROW. The argument above is
# about which platform answers the most questions for the least
# trouble, and Linux still wins it. What Linux cannot answer is
# anything that turns on Windows being Windows: path separators, the
# long-path ceiling, a file still locked by the process that wrote it,
# and whether the archive's internal layout survives a Windows
# unpacking. compat.py has never run on Windows at all. So there is
# ONE Windows job and it runs ONE script -- tools/install_and_load.py
# against the built zip, on one QGIS. Not the suite, not the gallery,
# not the reference comparison: the mathematics is platform-blind and
# Linux already covers it three ways, and a second full matrix would
# double the maintenance for answers we already have.
#
# NOT done here, on purpose:
#
#   the visual gallery and the Lab-colourspace reference comparison.
#   Their thresholds were tuned against this machine's fonts and
#   antialiasing; a runner with different fonts would fail them for
#   reasons that mean nothing, and a noisy gate is one people switch
#   off. They stay in the local release.
#
#   the secrets audit as the ONLY check. It runs here too, but the
#   authoritative run is local and pre-commit: CI sees the code after
#   a push, by which time a leaked key is already public and rotation
#   is the only remedy.
#
#   releasing. release.py promotes a locally reviewed candidate; see
#   docs/PUBLISHING.md.
#
# FIRST RUN WILL PROBABLY FAIL. Container tags move, and the image's
# Python may or may not carry every package. Read the log, adjust the
# matrix, and expect two or three iterations -- that is normal for a
# CI file and not a sign the approach is wrong.

name: tests

on:
  push:
    # main, and the pre-candidate branches the release process pushes
    # BEFORE building a candidate locally (docs/PUBLISHING.md). Without
    # the pattern a pre-candidate push started nothing at all, and the
    # parallel-CI process described there would have waited on a run
    # that was never going to happen. (2026-08-10.)
    branches: [main, "pre-**"]
  pull_request:
  workflow_dispatch:

# Action versions: the majors pinned below are the ones whose action.yml
# declares `using: node24`, checked against each repository on
# 2026-08-11. GitHub is retiring the Node 20 runtime, and until a major
# is bumped every run prints a deprecation warning for each action still
# on it -- harmless today, a failure whenever the forced upgrade ends.
# Pin the MAJOR only (@v7, never @v7.0.1): patches carry the security
# fixes, and a pin so tight that nothing can move is a pin nobody
# maintains. Re-check at the next deprecation notice; the warning names
# the actions, which is all the audit anybody needs.
jobs:
  # Fast checks first, on a plain runner with no QGIS at all. A typo
  # in a docstring should fail in twenty seconds rather than after a
  # container pull and a twenty-minute suite.
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Documentation and rule standards
        run: python3 tools/check_standards.py
      - name: Secrets and machine-specific paths
        run: python3 tools/check_no_secrets.py
      - name: User-facing text has been reviewed
        run: python3 tools/text_review.py --check

      # Two release stages that need NO QGIS and take seconds, so they
      # cost this twenty-second job nothing and move two classes of
      # failure from "eighty minutes into a release" to "the push that
      # caused it".
      - name: The claims the published files make
        # --check asks only the questions whose answer is somebody's
        # WORDS -- a missing changelog entry, a stale image, a broken
        # link, a vendored version claimed in prose, a repository URL.
        # The citation's version is skipped because a release mends it
        # itself, so gating a push on it would be red by design. All
        # file and text checking, no QGIS, under a second.
        run: python3 tools/sync_release_content.py --check
      - name: The plugin still packages
        # proves shipped_files() resolves and the zip keeps the shape
        # the QGIS plugin repository requires -- one top-level folder
        # carrying __init__.py and metadata.txt. build.py is stdlib
        # only, so this needs no container.
        run: python3 build.py

  # The suite, inside QGIS's own image. The matrix is the entire point
  # of this job: two QGIS versions, so a change that only works on the
  # one installed at home fails here rather than in somebody's issue
  # tracker.
  suite:
    runs-on: ubuntu-latest
    needs: standards
    # A backstop under the suite's own per-test watchdog, which names
    # the stuck test and exits. If BOTH fail, this stops a silent job
    # well short of GitHub's six-hour ceiling: the first run here hung
    # for one hour and forty-eight minutes and was cancelled by hand.
    #
    # Ninety, not forty. Forty was the first guess and it was sized
    # against the 24-minute macOS suite, forgetting that these runners
    # are slower and that the provisioning step downloads a scientific
    # stack before the suite starts: the first healthy run measured
    # about halfway through the tests at twenty-one minutes, which
    # projects past forty. A ceiling a legitimate run can reach is
    # worse than none, because a red job that means nothing is how
    # people learn to ignore red jobs. The per-test watchdog is the
    # instrument that catches a real hang, and it names the test; this
    # only has to be lower than six hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Verified against hub.docker.com/r/qgis/qgis/tags on
        # 2026-08-09. Each leg answers a different question:
        #
        #   4.0.0  -- the floor metadata.txt DECLARES
        #             (qgisMinimumVersion=4.0). If this fails, the
        #             metadata is promising something untrue and
        #             users on 4.0 will install a plugin that cannot
        #             run.
        #   4.0.3  -- exactly what the developer's machine runs, so a
        #             failure here is a LINUX-versus-macOS difference
        #             rather than a version one. The control leg.
        #   stable -- currently 4.2.1, two minor versions ahead of
        #             anything this project has ever been run on, and
        #             a moving target: when a new QGIS breaks us it
        #             fails here rather than in a user's issue.
        #
        # NOT `latest`: on this repository it is a 3.44 NIGHTLY, below
        # our declared minimum, so the plugin would not even load --
        # and a nightly is a poor thing to gate on regardless.
        qgis: ["4.0.0", "4.0.3", "stable"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
      # The suite renders offscreen and never opens a window.
      options: --user root
    env:
      QT_QPA_PLATFORM: offscreen
      # HOW SLOW THIS MACHINE IS, declared rather than guessed. Every
      # timing allowance in the suite is CONTENTION times this, and
      # CONTENTION alone accounts for SHARDING, which CI does not use
      # -- so without this the ceilings on every runner are the
      # development Mac's. These legs stalled a test at the 600s
      # watchdog on all three QGIS versions on 2026-08-16 while the
      # same test took 101s on that Mac.
      #
      # 3, round and conservative rather than measured, and between
      # macOS's 2 and Windows's 4. Replace it with a ratio of the
      # slowest measured runs of one test on both machines, and say
      # so here when you do.
      WEAVINGSPACE_TEST_SLOWNESS: "3"
      # where the step above puts the pristine upstream checkout, so
      # the vendor comparison runs instead of skipping
      WEAVINGSPACE_UPSTREAM: ${{ github.workspace }}/../weavingspace
      # The plugin's own dependency provisioner may fetch wheels on a
      # machine whose QGIS lacks them, which is exactly the Linux path
      # worth exercising. Left on deliberately.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Let git work at all in this container
        # The qgis images run as root while the checkout belongs to
        # the runner user, so git refuses the repository outright
        # ("detected dubious ownership") and EVERY git command fails.
        # Tests that shell out to git then fail for a reason that has
        # nothing to do with what they are testing -- three did on
        # 2026-08-12, one of them newly written. The mutation workflow
        # learned this the same day; this is the same fix, here.
        # ...and qgis/qgis:stable has no git AT ALL, so this must not
        # be an unconditional command: it exited 127 and failed all
        # three stable jobs on 2026-08-12. Absence is reported rather
        # than passed over, because the tests that shell out to git
        # behave differently here and a silent skip would leave
        # somebody reading a green stable run as if it had covered
        # the same ground as the others.
        run: |
          if command -v git >/dev/null 2>&1; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          else
            echo "NO GIT IN THIS IMAGE: tests that shell out to git "\
                 "will report it as unavailable rather than failing"
          fi

      - name: What QGIS is this, actually
        # Recorded every run: when a failure appears months from now,
        # the first question is always which QGIS and which Python.
        run: |
          python3 -c "import qgis.core; print('QGIS', qgis.core.Qgis.QGIS_VERSION)"
          python3 --version
          python3 -c "import geopandas, shapely, pandas; print('geopandas', geopandas.__version__, '| shapely', shapely.__version__, '| pandas', pandas.__version__)" || echo "scientific stack incomplete -- deps.py's provisioning path is what this platform exercises"

      - name: The upstream library, at the commit we vendor
        # test_the_vendoring_tool_reproduces_the_current_vendor rebuilds
        # vendor/ from a pristine upstream and compares. Without a
        # checkout it SKIPS -- loudly, but it skips, so the guard
        # against a hand-edited vendor has been running on one machine
        # only. The test itself deliberately never downloads ("a test
        # that reaches the network is a test that fails when somebody
        # is on a train"), so the checkout is the workflow's job.
        #
        # Pinned to the commit in vendor/VENDOR-VERSION.txt, NOT to
        # upstream's HEAD: comparing against HEAD would fail every time
        # upstream moved, which is news about them rather than about
        # us, and is exactly the noisy gate people learn to ignore.
        # A failure to clone leaves the test skipping as before.
        continue-on-error: true
        run: |
          pin=$(sed -n 's/.*(\(.*\))/\1/p' weavingspace_qgis/vendor/VENDOR-VERSION.txt)
          echo "vendor stamp names commit ${pin}"
          git clone --quiet https://github.com/DOSull/weavingspace.git \
            "${GITHUB_WORKSPACE}/../weavingspace"
          git -C "${GITHUB_WORKSPACE}/../weavingspace" checkout --quiet "${pin}"
          git -C "${GITHUB_WORKSPACE}/../weavingspace" log -1 --oneline

      - name: Provision what this QGIS lacks, the way the plugin does
        # The qgis/qgis images ship QGIS and nothing else, so the first
        # run here produced seventy failures of which sixty-nine were
        # one missing geopandas wearing different costumes. This runs
        # the plugin's OWN deps module -- wheel-tag matching, the numpy
        # 1.x floor, the pyproj data redirection -- which is code a Mac
        # whose QGIS already carries every package can never exercise.
        # It is a maintainer tool in tools/, outside the shipped zip:
        # the plugin itself still asks before it downloads anything,
        # and test_pypi_provisioning_is_reached_only_through_consent
        # keeps it that way.
        run: python3 -u tools/ci_provision.py

      - name: Functional suite
        run: python3 -u tests/run_tests.py

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.qgis }}
          path: reports/
          if-no-files-found: ignore

  # The first thing a user does, and the one thing neither machine
  # tested: unpack the zip into a QGIS profile and let QGIS load it.
  # The suite imports the plugin from the CHECKOUT; the release builds
  # an archive and never opens it. An archive of the wrong shape, a
  # file the packing rule forgot, or an import that only worked
  # because the repository was on sys.path would all reach a user
  # before they reached us -- and this is the path a plugin repository
  # reviewer looks at hardest.
  #
  # A SEPARATE job, deliberately. GitHub runs jobs concurrently, so
  # four minutes beside the suite's fifty-four costs nothing on the
  # clock; folding it into the suite legs would add to every one of
  # them. It is a matrix over the same versions because the metadata
  # PROMISES QGIS 4.0, and a plugin that will not load on the floor it
  # declares is a promise broken at install time.
  install:
    runs-on: ubuntu-latest
    needs: standards
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        qgis: ["4.0.0", "4.0.3", "stable"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
      options: --user root
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Let git work at all in this container
        # The qgis images run as root while the checkout belongs to
        # the runner user, so git refuses the repository outright
        # ("detected dubious ownership") and EVERY git command fails.
        # Tests that shell out to git then fail for a reason that has
        # nothing to do with what they are testing -- three did on
        # 2026-08-12, one of them newly written. The mutation workflow
        # learned this the same day; this is the same fix, here.
        # ...and qgis/qgis:stable has no git AT ALL, so this must not
        # be an unconditional command: it exited 127 and failed all
        # three stable jobs on 2026-08-12. Absence is reported rather
        # than passed over, because the tests that shell out to git
        # behave differently here and a silent skip would leave
        # somebody reading a green stable run as if it had covered
        # the same ground as the others.
        run: |
          if command -v git >/dev/null 2>&1; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          else
            echo "NO GIT IN THIS IMAGE: tests that shell out to git "\
                 "will report it as unavailable rather than failing"
          fi
      - name: Provision what this QGIS lacks, the way the plugin does
        run: python3 -u tools/ci_provision.py
      - name: Build the zip a user would install
        run: python3 build.py
      - name: Install it into a profile and load it
        run: python3 -u tools/install_and_load.py dist/weavingspace_qgis.zip

  # The same question as `install`, asked on WINDOWS. One job, one
  # script, one QGIS -- see the WINDOWS paragraph at the top of this
  # file for why it is this narrow and stays this narrow.
  #
  # HOW QGIS GETS HERE, and why it is Chocolatey. Four routes were
  # looked at and only one of them is a route somebody is actually
  # driving. Chocolatey's `qgis` package installs the STANDALONE
  # installer's QGIS -- the same MSI a Windows user downloads from
  # qgis.org, with its own Python and the `python-qgis*.bat` shims --
  # and running plugin tests through exactly that is what
  # GispoCoding's plugin template does and what its FVH-3T plugin
  # runs on windows-latest today. The OSGeo4W network installer is
  # the other credible route and is genuinely used on GitHub runners
  # (GRASS drives it through the setup-OSGeo4W action, 89 seconds for
  # 22 packages), but nobody was found installing QGIS ITSELF that
  # way in a workflow, so choosing it would have meant guessing at
  # installer flags on a job that costs a quarter of an hour to
  # retry. conda-forge ships a win-64 QGIS and no project was found
  # using it on a Windows runner; it is also a different build with a
  # different Python, so a pass there would describe an environment
  # almost nobody using this plugin is in. There is no Windows QGIS
  # container worth the name.
  #
  # `qgis` and NOT `qgis-ltr`: Chocolatey's LTR is 3.44, below the
  # 4.0 floor metadata.txt declares, so the plugin would refuse to
  # load and the job would be red about nothing. This is the same
  # reason the Linux matrix does not use the `latest` image.
  #
  # ONE version, and it is whatever Chocolatey serves that week --
  # the package tracks the current release, so there is no pinning to
  # be had. The version is PRINTED every run instead, which is what
  # the Linux legs do for the reason that matters: when this fails in
  # six months the first question is which QGIS.
  #
  # NOT cached. Caching the install would save most of the wall clock
  # and introduce the one failure this job cannot afford -- a cache
  # key that stops matching what Chocolatey now serves leaves the job
  # green against a QGIS nobody runs, silently. The download is on
  # somebody else's clock and this job runs beside the suite's legs,
  # so it costs nothing anybody is waiting for.
  windows:
    runs-on: windows-latest
    needs: standards
    # NOT A BUDGET, and not measured: nothing in this project has ever
    # timed a QGIS install on a GitHub Windows runner, so this number
    # is a hang-catcher sized well above any plausible healthy run
    # rather than a ceiling derived from anything. Replace it with a
    # multiple of the first GREEN run's duration, and not before -- a
    # ceiling a healthy run can reach is worse than none.
    # RE-SIZED when the suite and the gallery joined this job. The
    # 60 minutes above fitted install-and-load alone and would now
    # kill the job partway through the suite, producing a red
    # result that means nothing -- which this project has already
    # done twice by sizing a limit against the wrong thing. Still a
    # hang-catcher rather than a budget, and still to be replaced by
    # a multiple of the first GREEN Windows run rather than by the
    # Linux figures, which are a different machine.
    timeout-minutes: 300
    env:
      # Set to match the other jobs, and this is the line here with
      # the least evidence behind it. Qt's Windows builds do carry the
      # offscreen platform plugin, but the one plugin project found
      # doing this sets the variable on Linux ONLY and leaves Windows
      # alone. If a run dies with a Qt platform-plugin message, that
      # is what this is: drop the variable (a Windows runner has a
      # session and the default `windows` platform works) or try
      # `minimal`. It is named here so nobody has to rediscover it.
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      # HOW SLOW THIS MACHINE IS, declared rather than guessed.
      # Every timing allowance in the suite is CONTENTION times
      # this; without it an unsharded run gets ceilings sized for
      # the Mac the suite was written on, which failed a test
      # here at 18.7s on 2026-08-16 that macOS passed in 9.0s.
      # 4 is DELIBERATELY ROUND AND CONSERVATIVE rather than measured:
      # the figures to hand are a Windows runner spending 250s on
      # tests this Mac runs in tens of seconds. Replace it with a
      # ratio of the SLOWEST measured runs of one test on both.
      WEAVINGSPACE_TEST_SLOWNESS: "4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the zip a user would install
        # build.py is stdlib only, so the runner's own Python builds
        # the archive and QGIS's Python opens it -- which is closer to
        # the real division of labour than doing both in one
        # interpreter, and gets the archive built before the long
        # install rather than after it.
        run: python build.py

      - name: Install QGIS the way a Windows user does
        # Chocolatey is already on the runner, so this needs no action
        # to pin and nothing to maintain when that action moves. The
        # package fetches and runs the standalone installer, which is
        # 590 MB for 4.2.0 (measured off qgis.org, 2026-08-15) and
        # unpacks to several times that with Windows Defender reading
        # every file: the install, not the download, is where this
        # job's minutes go. --no-progress keeps a download bar out of
        # the log, where it would otherwise be most of it.
        shell: pwsh
        run: choco install qgis -y --no-progress

      - name: What actually got installed
        # BEFORE anything tries to use it, because the alternative is
        # "the system cannot find the path specified" from a batch
        # shim and no way to tell whether the install did nothing,
        # landed under another name, or landed a version whose folder
        # is spelt differently. Instrumenting a remote failure costs
        # three lines up front and a whole round afterwards, and a
        # round here is however long a gigabyte takes.
        #
        # The folder carries the VERSION in its name ("QGIS 4.2.0"),
        # so it is globbed rather than written down: the template this
        # recipe comes from hardcoded `QGIS 3.16` and broke on the
        # next upgrade. The shim is likewise found rather than
        # assumed, since `qgis` and `qgis-ltr` install
        # python-qgis.bat and python-qgis-ltr.bat respectively.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Get-Item, NOT Get-ChildItem: given a wildcard path,
          # Get-ChildItem returns what is INSIDE each match, so it
          # would hand back bin's contents rather than bin.
          $bin = Get-Item "C:\Program Files\QGIS *\bin" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bin) {
            Get-ChildItem "C:\Program Files" | Select-Object -ExpandProperty Name
            throw "no 'C:\Program Files\QGIS *\bin' after the install: Chocolatey reported success but this is not a QGIS this job can drive"
          }
          Get-ChildItem $bin.FullName -Filter "*qgis*.bat" |
            Select-Object -ExpandProperty Name
          $shim = Get-ChildItem $bin.FullName -Filter "python-qgis*.bat" |
            Select-Object -First 1
          if (-not $shim) {
            throw "no python-qgis*.bat under $($bin.FullName): the QGIS is there but its Python shim is not, which is the shape of a half-unpacked install"
          }
          "QGIS_SHIM=$($shim.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "using $($shim.FullName)"

      - name: What QGIS is this, actually, and REFUSE anything but 4.x
        # The Linux legs record this every run for the same reason:
        # months from now the first question about a failure here is
        # which QGIS and which Python, and the answer has to be in the
        # log rather than in somebody's memory of what Chocolatey
        # served that week.
        #
        # And it is ASSERTED, not merely printed. metadata.txt declares
        # qgisMinimumVersion=4.0 and this plugin is PyQt6/Python 3.12
        # throughout; Chocolatey's `qgis` package is 4.x today and its
        # `qgis-ltr` is 3.44, but a package that moves under us would
        # otherwise turn this job green against a QGIS the plugin does
        # not support -- a green that means the opposite of what it
        # says. Printing a version is not checking it, which is the
        # rule this project already writes down about its own
        # standards checker. (Maintainer's instruction, 2026-08-15:
        # no 3.x is allowed here.)
        shell: cmd
        run: |
          call "%QGIS_SHIM%" -c "import qgis.core, sys; print('QGIS', qgis.core.Qgis.QGIS_VERSION); print(sys.version)"
          call "%QGIS_SHIM%" -c "import sys, qgis.core as q; v=q.Qgis.QGIS_VERSION; sys.exit(0) if v.split('.')[0]=='4' else (sys.stderr.write('REFUSED: this job requires QGIS 4.x and Chocolatey served '+v+'. The plugin declares qgisMinimumVersion=4.0 and is PyQt6-only, so a 3.x run would report a pass that means nothing. Fix the package, do not relax this check.\n') or sys.exit(1))"

      - name: Install it into a profile and load it
        # No provisioning step, unlike the Linux legs, and that is a
        # measurement rather than an oversight: classFactory calls
        # deps.add_paths and imports plugin.py, which imports Qt and
        # deps and nothing scientific, and initGui only builds a
        # QAction. Verified by running this same script under macOS
        # QGIS 4.0.3 against a zip, with none of the stack on the
        # path. Adding ci_provision here would download a scientific
        # stack to answer a question this script never asks, and would
        # put a second, slower failure surface in front of the one
        # thing this job exists for.
        #
        # The exit code reaches GitHub only because the shim ends with
        # `python %*`. If a future QGIS ships a shim that does
        # anything after that, this job can go GREEN on a failed load
        # -- so if it ever starts passing suspiciously fast, check
        # that the log still ends in the INSTALLED AND LOADED line.
        #
        # Forward slashes in the path deliberately: Python takes them
        # on Windows, and tools/check_standards.py reads this line to
        # prove the script it names still exists.
        shell: cmd
        run: |
          call "%QGIS_SHIM%" -u tools/install_and_load.py dist/weavingspace_qgis.zip

      - name: Provision the scientific stack, through the plugin's own code
        # AFTER the load test above, deliberately: that step's whole
        # value is proving the plugin loads with NONE of this present,
        # which is what a user meets before they have consented to
        # anything. Provisioning first would destroy that measurement.
        #
        # Through `ci_provision.py`, which calls the plugin's own deps
        # module rather than pip -- wheel-tag matching, the numpy 1.x
        # floor and the pyproj data redirection are plugin code, and
        # this is the only place they run against WINDOWS wheels. The
        # separation that keeps this out of shipped code is unchanged:
        # tools/ is not in build.shipped_files(), and no flag lets the
        # plugin skip its consent dialogue.
        shell: cmd
        run: call "%QGIS_SHIM%" -u tools/ci_provision.py

      - name: What the stack looks like here
        # Reported rather than asserted: if a package is missing the
        # suite below will say so far more precisely than a guard
        # here could, and this line is what makes that failure
        # readable months later.
        shell: cmd
        run: |
          call "%QGIS_SHIM%" -c "import geopandas, shapely, pandas; print('geopandas', geopandas.__version__, '| shapely', shapely.__version__, '| pandas', pandas.__version__)"

      - name: Functional suite
        # THE SAME SUITE THE MAC RUNS, because a platform that only
        # proves the plugin loads has not been tested -- it has been
        # smoke-tested. compat.py exists precisely because QGIS moves
        # its APIs, and Windows is where most users are; running 434
        # tests here is the only way that module is ever exercised off
        # this project's one Mac. (Maintainer's instruction,
        # 2026-08-15: Windows and Linux should test as much as macOS
        # does, within only the limits GitHub imposes that we cannot
        # code around.)
        #
        # THE TIMEOUT IS A HANG-CATCHER, NOT A BUDGET, and it is sized
        # from the slowest MEASURED figure plus room: the Linux legs
        # take 52 to 54 minutes and Windows has never been measured at
        # all. Re-size it from the first green run rather than leaving
        # a number nobody checked -- this project has twice produced a
        # red result that meant nothing by sizing a limit against the
        # machine in front of it.
        timeout-minutes: 180
        env:
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: call "%QGIS_SHIM%" -u tests/run_tests.py

      - name: Visual gallery
        # The renders, scored against the ramps in force. Kept out of
        # CI for months on a belief about fonts that turned out to be
        # false on Linux; Windows is a second, independent test of the
        # same belief, and if its Delta-E figures come out wide that
        # is a FINDING about this platform rather than a reason to
        # loosen the thresholds.
        timeout-minutes: 60
        env:
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: call "%QGIS_SHIM%" -u tests/visual_tests.py

      - name: Keep what it drew, when it goes wrong
        # A failure here is read by somebody who cannot reproduce it:
        # this project has one Mac and no Windows machine at all, so
        # the renders ARE the evidence.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-reports
          path: reports/
          if-no-files-found: ignore
  # macOS, on the package a USER installs, in a profile nobody seeded.
  #
  # The development machine is macOS, so this leg is not here for the
  # platform -- it is here for the other two things CI is for: a
  # DIFFERENT QGIS and a CLEAN CHECKOUT. Both turned out to matter
  # more than they sound. The developer runs one particular vcpkg
  # build of 4.0.3; Homebrew's cask is what a macOS user actually
  # gets, and nothing tested that. And on 2026-08-15 the colourspace
  # comparison was found to pass on the development machine only
  # because its QGIS style library had been seeded by the plugin years
  # earlier: RdBu, PiYG, PuOr and Spectral were the plugin's own
  # versions, tagged mapweaver, while a fresh QGIS ships ColorBrewer
  # ramps under those names and the plugin's install is additive only.
  # A runner is a fresh profile. It is the only thing here that can
  # tell "my machine" from "the software".
  #
  # SAME SCOPE AS WINDOWS, deliberately: install the package, load the
  # zip with none of the scientific stack present, then provision and
  # run the suite and the gallery.
  #
  # ONE CAVEAT THAT IS macOS-ONLY, and it may stop the suite here.
  # Code signing (library validation) refuses unsigned PyPI C
  # extensions inside the signed QGIS process, which is why this
  # project's own reference tooling lives in .venv-reference and never
  # in QGIS's Python. If the cask ships geopandas and friends the
  # suite runs; if it does not, provisioning may be refused and the
  # suite will say so loudly rather than being skipped quietly. That
  # answer is the point of the first run.
  macos:
    runs-on: macos-latest
    needs: standards
    # Sized for a large cask download plus the suite, and to be
    # replaced by a multiple of the first GREEN run on this runner
    # rather than by another platform's figures.
    timeout-minutes: 300
    env:
      # HOW SLOW THIS MACHINE IS, declared rather than guessed. Every
      # timing allowance in the suite is CONTENTION times this, and
      # CONTENTION alone accounts for SHARDING -- which CI does not
      # use -- so without this the ceilings here are the development
      # Mac's. This runner is the closest of the three to that Mac
      # (same platform, slower hardware), hence 2 where Windows takes
      # 4. Round and conservative rather than measured: replace it
      # with a ratio of the slowest measured runs of one test on both
      # machines, and say so here when you do.
      WEAVINGSPACE_TEST_SLOWNESS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip a user would install
        run: python3 build.py

      - name: Install QGIS the way a macOS user does
        # The cask, not a vcpkg build: the question this job answers is
        # what happens on the package people actually download.
        #
        # DIAGNOSTIC BEFORE THE ATTEMPT, because the first run failed
        # here and left nothing to read. `brew info` prints the cask's
        # version, its architecture and any macOS requirement whether
        # or not the install then works, so a second failure arrives
        # with the reason attached rather than sending somebody back
        # for another round. The same rule the Windows job follows for
        # its install layout: fail with a listing.
        run: |
          set -x
          sw_vers
          uname -m
          brew --version
          brew info --cask qgis || echo "no cask called qgis in this tap"
          # NOT --no-quarantine: Homebrew removed that option, and the
          # first attempt died on "invalid option" before downloading
          # anything. Quarantine does not matter here anyway -- this
          # job runs the bundled interpreter directly rather than
          # launching the app through Finder, which is what the
          # attribute gates.
          brew install --cask qgis

      - name: What actually got installed, and does its Python START
        # PROBED, not assumed, exactly as the Windows job learned to
        # do: the app's name and its bundled Python's path have both
        # moved between QGIS releases, and a guess fails with a
        # confusing error instead of a listing.
        #
        # FINDING the interpreter is not enough, which is what the
        # second round here discovered. The cask's
        # Contents/MacOS/python3.12 was built on the QGIS project's own
        # runner and carries THAT machine's paths: it reported a
        # `sys.base_prefix` inside a vcpkg build tree that exists on no
        # other computer, and died with "No module named 'encodings'"
        # before running a line of Python, because the standard library
        # was not where it was told. PYTHONHOME repairs it, and where it points
        # has itself moved between releases. So the discovery lives in
        # `tools/macos_qgis_env.sh`, which tries each combination and
        # keeps the one that actually imports qgis.core -- and
        # `tests/run_tests_macos.sh` calls the same script, so the
        # runner and the development machine cannot drift apart about
        # how to start this interpreter.
        #
        # Its output is KEY=value lines on stdout and diagnostics on
        # stderr, so it appends straight into the step environment and
        # every later step inherits PYTHONHOME, PROJ_LIB and
        # QGIS_PREFIX_PATH.
        run: |
          set -e
          bash tools/macos_qgis_env.sh >> "$GITHUB_ENV"
          echo "--- what the rest of this job will use ---"
          cat "$GITHUB_ENV"

      - name: What QGIS is this, actually, and REFUSE anything but 4.x
        # Asserted rather than printed, for the reason the Windows job
        # gives: metadata.txt declares qgisMinimumVersion=4.0 and the
        # plugin is PyQt6-only, so a 3.x run would report a pass that
        # means nothing.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          "$QGIS_PY" -c "import qgis.core, sys; print('QGIS', qgis.core.Qgis.QGIS_VERSION); print(sys.version)"
          "$QGIS_PY" -c "import sys, qgis.core as q; v=q.Qgis.QGIS_VERSION; sys.exit(0) if v.split('.')[0]=='4' else (sys.stderr.write('REFUSED: this job requires QGIS 4.x and Homebrew served '+v+'. The plugin declares qgisMinimumVersion=4.0 and is PyQt6-only, so a 3.x run would report a pass that means nothing. Fix the cask, do not relax this check.\n') or sys.exit(1))"

      - name: Install it into a profile and load it
        # BEFORE provisioning, as on Windows: this step's value is
        # proving the plugin loads with none of the scientific stack
        # present, which is what a user meets before consenting to
        # anything.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$QGIS_PY" -u tools/install_and_load.py dist/weavingspace_qgis.zip

      - name: What the stack looks like here, before anything is added
        # REPORTED, never fatal. Whether the cask ships geopandas is
        # the question this job was added to answer, and the answer is
        # useful either way.
        continue-on-error: true
        run: |
          "$QGIS_PY" -c "import geopandas, shapely, pandas; print('geopandas', geopandas.__version__, '| shapely', shapely.__version__, '| pandas', pandas.__version__)" \
            || echo "the cask does not ship the scientific stack; the next step tries to add it"

      - name: Provision it, through the plugin's own code
        # Non-fatal BECAUSE OF CODE SIGNING: library validation can
        # refuse an unsigned C extension inside the signed QGIS
        # process, and that refusal is a finding about macOS rather
        # than a defect in this plugin. The suite below then fails
        # with a plain ModuleNotFoundError, and the two steps together
        # say exactly what happened.
        continue-on-error: true
        run: |
          "$QGIS_PY" -u tools/ci_provision.py

      - name: Which ramps this FRESH profile has, and whose they are
        # The reason this job exists, made permanent. On a seeded
        # profile these four are the plugin's, tagged mapweaver; on a
        # fresh QGIS they are ColorBrewer's, and the plugin's additive
        # install leaves them alone. Printed on every run so the next
        # colour surprise is one lookup away.
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$QGIS_PY" -c "from qgis.core import QgsApplication, QgsStyle; app=QgsApplication([], False); app.initQgis(); st=QgsStyle.defaultStyle(); names=set(st.colorRampNames()); [print(n, 'present' if n in names else 'ABSENT', st.tagsOfSymbol(QgsStyle.ColorrampEntity, n) if n in names else []) for n in ('RdBu','PiYG','PuOr','Spectral','Greys','viridis')]"

      - name: Functional suite
        timeout-minutes: 180
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$QGIS_PY" -u tests/run_tests.py

      - name: Visual gallery
        timeout-minutes: 60
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$QGIS_PY" -u tests/visual_tests.py

      - name: Keep what it drew, whatever it said
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-reports
          path: reports/
          if-no-files-found: ignore

  # The visual gallery, on Linux, on every push.
  #
  # It was kept out of CI for months on the belief that its Delta-E
  # thresholds were tuned to one machine's fonts and antialiasing.
  # That belief was never tested, and on 2026-08-12 an experiment
  # tested it: 13 of 13 cases pass on 4.0.0, 4.0.3 and stable, and
  # the renders agree with the library's own output at dE mean 0.3
  # to 0.5, p95 1.0 to 1.1 -- the same figures this project's Mac
  # produces, and far below the ~2.3 that is a just-noticeable
  # difference.
  #
  # Its own JOB rather than a step in the suite legs: fifty-five
  # seconds in parallel adds nothing to a leg that takes fifty-four
  # minutes, where a step inside would add to every one of them.
  # This is the gate that catches a WRONG MAP, which is this
  # software's characteristic failure, and it now catches one on
  # three QGIS versions instead of nobody's until release time.
  gallery:
    runs-on: ubuntu-latest
    needs: standards
    # Raised from 20 when the colourspace comparison joined this
    # job: it builds a plain venv and pip-installs matplotlib and
    # friends before scoring, and the render itself is only seconds
    # of that.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        qgis: ["4.0.0", "4.0.3", "stable"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
      options: --user root
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Let git work at all in this container
        # The qgis images run as root while the checkout belongs to
        # the runner user, so git refuses the repository outright
        # ("detected dubious ownership") and EVERY git command fails.
        # Tests that shell out to git then fail for a reason that has
        # nothing to do with what they are testing -- three did on
        # 2026-08-12, one of them newly written. The mutation workflow
        # learned this the same day; this is the same fix, here.
        # ...and qgis/qgis:stable has no git AT ALL, so this must not
        # be an unconditional command: it exited 127 and failed all
        # three stable jobs on 2026-08-12. Absence is reported rather
        # than passed over, because the tests that shell out to git
        # behave differently here and a silent skip would leave
        # somebody reading a green stable run as if it had covered
        # the same ground as the others.
        run: |
          if command -v git >/dev/null 2>&1; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
          else
            echo "NO GIT IN THIS IMAGE: tests that shell out to git "\
                 "will report it as unavailable rather than failing"
          fi
      - name: Provision what this QGIS lacks, the way the plugin does
        run: python3 -u tools/ci_provision.py
      - name: Render the gallery and score it against the library
        run: python3 -u tests/visual_tests.py

      - name: Score it against the ORIGINAL renderer, in Lab space
        # The last stage the Mac ran that CI did not. It scores every
        # gallery render against `TiledMap.render` -- the library's
        # own output on identical inputs -- pixel-weighted nearest
        # neighbour Delta-E in both directions. It is the one check
        # that can catch a WRONG MAP as opposed to a broken one, which
        # is this software's characteristic failure, and it costs
        # about sixteen seconds.
        #
        # A PLAIN environment, not QGIS's: matplotlib and mapclassify
        # go into a venv, exactly as release.py builds .venv-reference
        # on the Mac. REFERENCE_PYTHON is the same override release.py
        # honours, so the two cannot drift into different
        # arrangements.
        #
        # `|| true` on the venv creation is deliberate and narrow: if
        # this environment cannot be built the step must say so in its
        # own words below rather than failing with a pip traceback
        # that reads as a plugin defect.
        run: |
          python3 -m venv .venv-reference || true
          if [ ! -x .venv-reference/bin/python3 ]; then
            echo "could not build the reference environment on this image;"
            echo "the gallery above still ran and still scored itself."
            exit 1
          fi
          .venv-reference/bin/pip install --quiet \
            geopandas matplotlib networkx mapclassify
          REPORTS=$(ls -d reports/v* 2>/dev/null | head -1)
          if [ -z "$REPORTS" ]; then
            echo "the gallery wrote no report directory, so there is"
            echo "nothing to score; see the step above."
            exit 1
          fi
          .venv-reference/bin/python3 tools/visual_reference_report.py "$REPORTS"

      - name: Keep the comparison, whatever it said
        # Wanted on a PASS as well as a failure: the PDF is how a
        # reader sees that the numbers are still where they were, and
        # a comparison nobody can look at is a number in a log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-comparison-${{ matrix.qgis }}
          path: reports/
          if-no-files-found: ignore
