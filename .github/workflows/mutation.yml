# How good are the tests? Asked on Linux, on demand, and REPORTED
# rather than enforced.
#
# This is deliberately a SEPARATE workflow from tests.yml, for two
# reasons. It must never colour a push's status: these runs answer
# "how good is the suite" and "has a refactor stopped an old test
# reaching what it names", and neither question should block a
# candidate that the gates have already passed. And it is slow --
# the catalogue sweep is hours even sharded -- so it cannot share a
# job with anything anybody waits for.
#
# Nothing here runs on push. It runs when somebody asks, which in
# practice means a watcher on the maintainer's machine dispatching it
# and reporting back (docs/MUTATION-LOOP.md).
#
# Read the results as findings for the NEXT release, not as a verdict
# on this one. A survivor is a claim about the tests that is false
# often enough to check first: count the call sites and read the
# named test before believing the suite is weak
# (docs/MUTATION-TESTING.md, "Before triaging, suspect the
# catalogue").

name: mutation

on:
  workflow_dispatch:
    inputs:
      what:
        description: "which instrument to run"
        required: true
        default: catalogue
        type: choice
        options:
          - catalogue      # the hand-picked entries, sharded
          - incremental    # only the lines changed since a tag
          - both
          - gallery        # an EXPERIMENT: see the gallery job below
      since:
        description: "incremental only: the tag to diff against"
        required: false
        default: v0.24.0
        type: string
      qgis:
        description: "which QGIS to ask (one is enough; see below)"
        required: false
        default: "4.0.3"
        type: choice
        options:
          - "4.0.3"     # the control: what the maintainer's machine runs
          - "stable"    # the current release, when that is the question

jobs:
  # The hand-picked catalogue: break each guarded behaviour in turn
  # and require its named test to fail. Split FOUR WAYS across
  # machines, each of which shards four ways again internally, so a
  # sweep that takes hours serially finishes in well under one.
  catalogue:
    if: inputs.what == 'catalogue' || inputs.what == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false          # every slice's findings, not the first
      matrix:
        slice: [0, 1, 2, 3]
    container:
      # ONE version is enough, and 4.0.3 by default. This asks whether
      # the TESTS still catch what they claim, which is a property of
      # the suite rather than of QGIS, so sweeping three versions
      # would pay three times for one answer.
      #
      # The default is the CONTROL version -- what the maintainer's
      # machine runs -- for two reasons. Triage happens there: a
      # survivor is investigated and fixed locally, and one that will
      # not reproduce on the QGIS you have is painful for no reason.
      # And `stable` is a MOVING tag, so pinning to it would make two
      # sweeps incomparable, with a changed rate ambiguous between the
      # suite drifting and the tag moving -- the same reason a
      # re-census is only a before/after while the source is
      # unchanged.
      #
      # Ask `stable` deliberately when the question really is whether
      # a newer QGIS has stopped an entry reaching its behaviour.
      image: qgis/qgis:${{ inputs.qgis }}
      options: --user root
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Provision what this QGIS lacks
        run: python3 -u tools/ci_provision.py
      - name: Sweep this slice of the catalogue
        # Reporting, not gating: the step is allowed to fail so that
        # the summary below is always written and every slice is
        # always read. An entry needing attention is a finding for the
        # next release, and a red X here must not read as a broken
        # build.
        continue-on-error: true
        run: |
          python3 -u tools/mutation_catalogue_sweep.py \
            --slice ${{ matrix.slice }}/4 --shards 4 \
            2>&1 | tee slice-${{ matrix.slice }}.log
      - name: Keep the slice's log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-slice-${{ matrix.slice }}
          path: slice-${{ matrix.slice }}.log
          if-no-files-found: warn

  # The measurement proper, on the lines that actually changed. This
  # is what release.py runs with --require 70; here it is asked
  # WITHOUT a threshold, because a number that stops a run belongs
  # beside the gates and a number that informs the next round belongs
  # here.
  incremental:
    if: inputs.what == 'incremental' || inputs.what == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: qgis/qgis:${{ inputs.qgis }}
      options: --user root
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # --since needs the tag and its history
          fetch-tags: true      # ...and the tag itself, which depth alone did not bring
      - name: Can this checkout actually see ${{ inputs.since }}
        # Instrument BEFORE the thing that will otherwise answer
        # quietly. On 2026-08-12 this leg reported "0 line(s) changed
        # since v0.24.0" while deps.py carried 89 of them: the ref was
        # not there and the tool diffed against nothing. mutate_auto
        # now refuses outright, and this step says which case it is
        # while the log is still cheap to read.
        run: |
          git rev-parse --verify "${{ inputs.since }}^{commit}" \
            || { echo "NOT FOUND: ${{ inputs.since }}"; git tag | tail -20; exit 1; }
      - name: Provision what this QGIS lacks
        run: python3 -u tools/ci_provision.py
      - name: Record which tests touch which lines
        # NOT housekeeping: this record decides which tests are even
        # offered the chance to notice a mutant, and a stale one
        # overstates survivors while ignoring the newest work.
        # mutate_auto refuses to sample against a stale record.
        run: python3 -u tools/coverage_per_test.py
      - name: Mutate the lines changed since ${{ inputs.since }}
        continue-on-error: true
        run: |
          python3 -u tools/mutate_auto.py --since ${{ inputs.since }} \
            2>&1 | tee incremental.log
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-incremental
          path: |
            incremental.log
            reports/
          if-no-files-found: warn

  # AN EXPERIMENT, and labelled one so nobody mistakes it for a gate.
  #
  # The visual gallery is kept out of tests.yml because its thresholds
  # were tuned to one machine's fonts and antialiasing. That reasoning
  # deserves testing rather than repeating, for a specific reason: the
  # gallery's SIBLING checks already run on Linux and pass. visual_pair
  # and visual_gamut live inside the functional suite, so every push
  # already compares rendered interiors against the ramps in force on
  # three QGIS versions, and they have not once complained about fonts.
  #
  # If the gallery's Delta-E limits survive a different font stack, the
  # rendered report becomes available on three QGIS versions instead of
  # one, which is worth knowing. If they do not, the numbers here say
  # BY HOW MUCH, which is the difference between "we decided not to"
  # and "we found out".
  #
  # Either way it stays here rather than moving to tests.yml unless the
  # experiment settles it, and it never runs on push.
  gallery:
    if: inputs.what == 'gallery'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        qgis: ["4.0.0", "4.0.3", "stable"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
      options: --user root
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Provision what this QGIS lacks
        run: python3 -u tools/ci_provision.py
      - name: What fonts does this container actually have
        # The whole question. Recorded before the gallery runs, so a
        # difference in the numbers can be read against a difference in
        # the font stack rather than guessed at.
        continue-on-error: true
        run: fc-list 2>/dev/null | head -20 || echo "fontconfig absent"
      - name: Render the gallery
        # Allowed to fail: that IS the experiment's result, and a
        # failure here must not read as a broken build.
        continue-on-error: true
        run: python3 -u tests/visual_tests.py 2>&1 | tee gallery.log
      - name: Keep the renders and the numbers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-${{ matrix.qgis }}
          path: |
            gallery.log
            reports/
          if-no-files-found: warn
