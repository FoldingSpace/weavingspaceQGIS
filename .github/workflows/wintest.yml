# THE TARGETED WINDOWS RUN. A standing tool, re-aimed when needed and
# not deleted. (Maintainer's instruction, 2026-09-08.)
#
# WHAT IT IS FOR. Windows is where most of this plugin's users are and
# the leg that finds what no other platform can -- a fixed pump that
# only a slow machine loses, a path separator, a file still locked by
# whatever wrote it. It is also the slowest answer in the project:
# reaching one test through the `windows` job costs about ninety
# minutes, because that job installs QGIS and then runs the whole
# suite. This installs the SAME QGIS the SAME way and runs only the
# tests named at the foot of this file, which is minutes rather than
# hours -- measured 2026-09-08 at about five.
#
# WHEN TO REACH FOR IT. A red on the Windows leg alone, or a repair
# for one that cannot be judged at home. The second is the case that
# earns it: the wait added on 2026-09-08 could not be exercised on an
# idle Mac at all, since the timer it waits for arms in microseconds
# there, so only this could say whether the repair worked.
#
# HOW TO RE-AIM IT. Edit the run line at the foot -- the names are
# `tools/run_some.py`'s, which are FUNCTION names -- and edit the
# note above it saying which red it is chasing. That edit is itself
# the trigger: this runs on pushes that touch THIS FILE ONLY, so it
# never lengthens an ordinary round and never competes with the rounds
# that gate a candidate.
#
# AND NAME THE SIBLINGS YOU DRIVE WITH IT. A repair usually has more
# than one caller; on 2026-09-08 the two tests routed through the same
# new waiter had never been driven on Windows at all, and one fix with
# three loops is how this project has lost a repair before.
#
# TWO TRAPS THIS FILE ALREADY PAID FOR. `workflow_dispatch` is listed
# and does not work from a feature branch: GitHub resolves a
# dispatchable workflow against the DEFAULT branch, so one that lives
# only here answers 404. And `WEAVINGSPACE_TEST_SLOWNESS` must match
# the `windows` job's, or a probe fails on a ceiling sized for the Mac
# and reports the runner rather than the plugin.
#
# WHAT IT HAS CHASED, kept so a reading months from now has the
# history: `a project whose output geopackage has moved`, which failed
# five Windows rounds for five while green on macOS and all three
# Linux legs; and `a save is deferred only when a run is really
# coming`, which failed three of one night's pushes on its own premise
# -- the spacing moved and the live debounce was not armed -- and
# passed here within five minutes of the repair.
name: windows targeted run

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/wintest.yml

jobs:
  probe:
    runs-on: windows-latest
    # A hang-catcher, not a budget: the install is the long half and
    # the one test takes minutes. Sized well above both.
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      # EVERY GATE NAMES ITSELF. The first probe round showed the
      # rewritten file ABSENT at judgement with "the region layer was
      # removed" warnings -- so the recovery run was REFUSED rather
      # than failing to write, and this plugin's ten live gates each
      # print their own name behind this flag. Deducing which gate
      # fired has cost this project two diagnoses already; one run
      # with the dump on answers it.
      WEAVINGSPACE_ADOPT_DUMP: "1"
      # The same declared slowness as the windows suite job, for the
      # same reason: the suite's timing allowances are CONTENTION
      # times this, and a probe that fails on a ceiling sized for the
      # Mac would report the runner rather than the plugin.
      WEAVINGSPACE_TEST_SLOWNESS: "4"
    steps:
      - uses: actions/checkout@v7

      - name: Install QGIS the way a Windows user does
        # The same Chocolatey route as ci.yml's windows job, so the
        # probe measures the same QGIS the failing job drives.
        shell: pwsh
        run: choco install qgis -y --no-progress

      - name: Find the Python shim
        # Copied from ci.yml's windows job: the folder carries the
        # version in its name, so both are globbed rather than
        # written down.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Get-Item "C:\Program Files\QGIS *\bin" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bin) {
            Get-ChildItem "C:\Program Files" | Select-Object -ExpandProperty Name
            throw "no 'C:\Program Files\QGIS *\bin' after the install"
          }
          $shim = Get-ChildItem $bin.FullName -Filter "python-qgis*.bat" |
            Select-Object -First 1
          if (-not $shim) {
            throw "no python-qgis*.bat under $($bin.FullName)"
          }
          "QGIS_SHIM=$($shim.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "using $($shim.FullName)"

      - name: Which QGIS is this
        # Printed so a reading months from now says which QGIS and
        # which Python produced it; the 4.x floor is asserted by the
        # gating job and merely reported here.
        shell: cmd
        run: call "%QGIS_SHIM%" -c "import qgis.core, sys; print('QGIS', qgis.core.Qgis.QGIS_VERSION); print(sys.version)"

      - name: Provision the scientific stack, through the plugin's own code
        # The test drives a full Generate, so it needs geopandas; the
        # same tools/ci_provision.py route as every other leg, outside
        # build.shipped_files(), consent untouched.
        shell: cmd
        run: call "%QGIS_SHIM%" -u tools/ci_provision.py

      # ROUND TWO OF THE DIAGNOSIS asks which EXIT from `_generate`
      # takes the recovery run. Round one established that the run
      # leaves no file, no layers and no message -- and the message
      # bar being empty is itself a clue, since one of that method's
      # eight exits refuses through a MODAL. Every exit names itself
      # now, the keep-the-result guard prints its whole decision, and
      # the failure block reads the modal store beside the bar.
      - name: Which weave topologies build on this platform
        # CHASING rc21's CI on 8de744d (2026-09-13). The two-letter guard's
        # full-width arm found "the library could not work out its
        # structure" for `basket weave ab|cd` here, where the Mac builds
        # it -- the C-356 shape -- so the probe says which weaves build
        # under THIS shapely and GEOS before any fixture is re-aimed.
        shell: cmd
        run: call "%QGIS_SHIM%" -u tools/probes/which_weave_topologies_build_here.py

      - name: The failing tests, and nothing else
        # BISECTING THE WINDOWS-ONLY DUAL RED of 7edb446 (2026-09-15): it passes
        # alone and fails in the full suite, so it runs here after the eighteen
        # tests registered just before it. Red here narrows the culprit to
        # these; green sends the search further back.
        shell: cmd
        run: call "%QGIS_SHIM%" -u tools/run_some.py test_an_edit_aimed_at_a_glued_class_moves_every_side_of_the_hole test_an_edit_aimed_at_a_two_letter_class_moves_that_class_alone test_an_edited_weave_draws_its_cloth_and_not_its_scaffolding test_an_edited_weave_keeps_its_rotation test_a_weaves_dual_asks_no_search_of_a_rectangle test_a_save_just_after_a_reading_switch_writes_the_new_motif test_a_full_width_weave_keeps_warp_and_weft_apart test_a_typed_hyphen_leaves_its_ground_dropped test_a_landing_keeps_a_selection_of_several_classes test_a_glued_class_is_lit_and_clicked_as_the_class test_a_weaves_readings_come_back_with_its_record test_a_landing_held_under_a_press_keeps_the_glued_reading test_a_reading_changed_under_a_standing_edit_redraws_the_map test_a_unit_can_be_copied_with_new_tiles_whatever_kind_it_is test_a_typed_strands_code_draws_the_elements_it_names test_a_strands_code_that_cannot_be_used_changes_nothing test_a_strands_code_the_box_accepts_builds_exactly_its_letters test_a_cube_strands_code_the_box_accepts_is_the_code_the_map_draws test_a_thin_weaves_dual_is_not_offered_where_the_map_cannot_take_it
