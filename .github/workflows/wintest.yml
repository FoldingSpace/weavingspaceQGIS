# A THROWAWAY, re-aimed rather than rewritten. Delete it once the
# Windows red it currently names is understood.
#
# 2026-09-08: `a save is deferred only when a run is really coming`
# has failed the Windows leg on three of tonight's pushes -- 6395fb5,
# 6ae296f and ba27911 -- always alone, always on its own premise: the
# spacing moved from 500 to 250 and the live debounce was not armed.
# Three tests changed a control, pumped a fixed fifty milliseconds and
# asserted the timer was armed, which is a bet on the machine, and
# this is the leg that loses it. `b387f09` waits on the event instead,
# through `_wait_for_the_live_debounce`, bounded by CONTENTION.
#
# WHY IT CANNOT BE JUDGED AT HOME: on an idle Mac the timer arms in
# microseconds, so the waiting branch never executes there. Only a
# slow Windows runner can say whether the repair works, and reaching
# it through the `windows` job costs about ninety minutes because that
# job installs QGIS and then runs the whole suite. This installs the
# same QGIS the same way and runs ONLY the tests in question.
#
# Its earlier question, kept because the file may be re-aimed again:
# `a project whose output geopackage has moved` failed five Windows
# rounds for five while green on macOS and all three Linux legs.
#
# Triggered by pushes that touch THIS FILE ONLY, so it never lengthens
# an ordinary push and never competes with the rounds that gate a
# candidate; re-aiming it at another test is an edit to the run line
# below, which is itself the trigger. `workflow_dispatch` is listed
# for the day this reaches the default branch, and does not work
# before then: GitHub resolves a dispatchable workflow against the
# DEFAULT branch, so one that lives only on a feature branch answers
# 404 -- the lesson winprobe.yml already carries.
name: windows single-test probe (temporary)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/wintest.yml

jobs:
  probe:
    runs-on: windows-latest
    # A hang-catcher, not a budget: the install is the long half and
    # the one test takes minutes. Sized well above both.
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      # EVERY GATE NAMES ITSELF. The first probe round showed the
      # rewritten file ABSENT at judgement with "the region layer was
      # removed" warnings -- so the recovery run was REFUSED rather
      # than failing to write, and this plugin's ten live gates each
      # print their own name behind this flag. Deducing which gate
      # fired has cost this project two diagnoses already; one run
      # with the dump on answers it.
      WEAVINGSPACE_ADOPT_DUMP: "1"
      # The same declared slowness as the windows suite job, for the
      # same reason: the suite's timing allowances are CONTENTION
      # times this, and a probe that fails on a ceiling sized for the
      # Mac would report the runner rather than the plugin.
      WEAVINGSPACE_TEST_SLOWNESS: "4"
    steps:
      - uses: actions/checkout@v7

      - name: Install QGIS the way a Windows user does
        # The same Chocolatey route as ci.yml's windows job, so the
        # probe measures the same QGIS the failing job drives.
        shell: pwsh
        run: choco install qgis -y --no-progress

      - name: Find the Python shim
        # Copied from ci.yml's windows job: the folder carries the
        # version in its name, so both are globbed rather than
        # written down.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Get-Item "C:\Program Files\QGIS *\bin" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bin) {
            Get-ChildItem "C:\Program Files" | Select-Object -ExpandProperty Name
            throw "no 'C:\Program Files\QGIS *\bin' after the install"
          }
          $shim = Get-ChildItem $bin.FullName -Filter "python-qgis*.bat" |
            Select-Object -First 1
          if (-not $shim) {
            throw "no python-qgis*.bat under $($bin.FullName)"
          }
          "QGIS_SHIM=$($shim.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "using $($shim.FullName)"

      - name: Which QGIS is this
        # Printed so a reading months from now says which QGIS and
        # which Python produced it; the 4.x floor is asserted by the
        # gating job and merely reported here.
        shell: cmd
        run: call "%QGIS_SHIM%" -c "import qgis.core, sys; print('QGIS', qgis.core.Qgis.QGIS_VERSION); print(sys.version)"

      - name: Provision the scientific stack, through the plugin's own code
        # The test drives a full Generate, so it needs geopandas; the
        # same tools/ci_provision.py route as every other leg, outside
        # build.shipped_files(), consent untouched.
        shell: cmd
        run: call "%QGIS_SHIM%" -u tools/ci_provision.py

      # ROUND TWO OF THE DIAGNOSIS asks which EXIT from `_generate`
      # takes the recovery run. Round one established that the run
      # leaves no file, no layers and no message -- and the message
      # bar being empty is itself a clue, since one of that method's
      # eight exits refuses through a MODAL. Every exit names itself
      # now, the keep-the-result guard prints its whole decision, and
      # the failure block reads the modal store beside the bar.
      - name: The failing tests, and nothing else
        # THE ONE WINDOWS-ONLY RED as of b387f09, plus the two
        # siblings that were routed through the same waiter -- because
        # one fix and three loops is how this project has lost a
        # repair before, and the siblings have never been driven here.
        shell: cmd
        run: call "%QGIS_SHIM%" -u tools/run_some.py test_a_save_is_deferred_only_when_a_run_is_really_coming test_a_tick_dropped_by_a_save_comes_back test_a_cancel_the_writer_could_not_serve_says_nothing
